services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --lower_case_table_names=1
    environment:
      MYSQL_DATABASE: comprasintelig
      MYSQL_USER: comprasint_add1
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # CI-030 - Redis
      Redis__ConnectionString: "redis:6379"

      # MySQL
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=comprasintelig;Uid=comprasint_add1;Pwd=${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env};AllowPublicKeyRetrieval=True;"

      # CI-031 - RabbitMQ
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__QueueName: comprasintelig.processamento
      RabbitMQ__UserName: ${RABBITMQ_USER:?Defina RABBITMQ_USER no arquivo .env}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}

    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NGINX_ENV: prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - internal

  pdf-parser:
    build: ./pdf-parser
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8081
    environment:
      PYTHONUNBUFFERED: "1"
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Defina RABBITMQ_USER no arquivo .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - internal

  worker:
    build:
      context: ./backend/Financeiro.Worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__QueueName: comprasintelig.processamento
      RabbitMQ__UserName: ${RABBITMQ_USER:?Defina RABBITMQ_USER no arquivo .env}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - internal

volumes:
  db_data:
  redis_data:
  rabbitmq_data:

networks:
  internal:
    driver: bridge
