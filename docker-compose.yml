
name: controle-financeiro

services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    command: --lower_case_table_names=1
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: comprasintelig
      MYSQL_USER: comprasint_add1
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - default


  backend:
    build: ./backend
    container_name: financeiro-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      # CI-030 - Redis
      Redis__ConnectionString: "redis:6379"

      # Banco de dados MySQL
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=comprasintelig;Uid=comprasint_add1;Pwd=${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env};AllowPublicKeyRetrieval=True;"

      # CI-031 - RabbitMQ
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__QueueName: comprasintelig.processamento
      RabbitMQ__UserName: ${RABBITMQ_USER:?Defina RABBITMQ_USER no .env}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}

    depends_on:
      db:
        condition: service_healthy
    networks:
      - default


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NGINX_ENV: local
    container_name: financeiro-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend
    networks:
      - default

  pdf-parser:
    build: ./pdf-parser
    container_name: pdf-parser-service
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8081
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: financeiro-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  rabbitmq:
    image: rabbitmq:4-management
    container_name: financeiro-rabbitmq
    restart: unless-stopped
    hostname: rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Defina RABBITMQ_USER no .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - default

  worker:
    build:
      context: ./backend/Financeiro.Worker
      dockerfile: Dockerfile
    container_name: financeiro-worker
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__QueueName: comprasintelig.processamento
      RabbitMQ__UserName: ${RABBITMQ_USER:?Defina RABBITMQ_USER no .env}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - default



volumes:
  db_data:
    external: true
    name: controle-financeiro_db_data

  redis_data:
    name: controle-financeiro_redis_data

  rabbitmq_data:
    name: controle-financeiro_rabbitmq_data

networks:
  default:
    external: true
    name: controle-financeiro_default
