server {
    listen 80;
    server_name comprasinteligente.com.br www.comprasinteligente.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    server_name comprasinteligente.com.br www.comprasinteligente.com.br;

    ssl_certificate /etc/letsencrypt/live/comprasinteligente.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comprasinteligente.com.br/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Validacao do certificado Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Encaminha as chamadas da API para o .NET
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # Permite navegar nas rotas do Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Evita cache do HTML principal
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
