server {
    listen 80;
    server_name comprasinteligente.com.br www.comprasinteligente.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}



server {
    listen 443 ssl;
    server_name comprasinteligente.com.br www.comprasinteligente.com.br;

    # Protocolos TLS permitidos
    ssl_protocols TLSv1.2 TLSv1.3;

    # Certificados Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/comprasinteligente.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comprasinteligente.com.br/privkey.pem;

    # Headers de seguranca
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS inicial - 5 minutos
    add_header Strict-Transport-Security "max-age=300" always;

    root /usr/share/nginx/html;
    index index.html;

    # Validacao do certificado Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

 location /api/ {
    # Limite de upload para requisicoes da API
    client_max_body_size 20m;

    proxy_pass http://backend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
}

    # Permite navegar nas rotas do Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Evita cache do HTML principal
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;
    }
}
