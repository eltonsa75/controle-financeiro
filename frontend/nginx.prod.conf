# Controle de requisicoes e conexoes por IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server_tokens off;

server {
    listen 80;
    server_name comprasinteligente.com.br www.comprasinteligente.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name comprasinteligente.com.br www.comprasinteligente.com.br;

    # TLS e certificados SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/comprasinteligente.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comprasinteligente.com.br/privkey.pem;

    # Protecao de conexoes
    limit_conn conn_limit 20;
    limit_conn_status 429;
    limit_req_status 429;

    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 30s;

    # Headers de seguranca
    add_header_inherit merge;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP em modo de observacao
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

    root /usr/share/nginx/html;
    index index.html;

    # Renovacao Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Bloqueio de arquivos ocultos
    location ~ /\. {
        deny all;
    }

    # Proxy reverso para API
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        client_max_body_size 20m;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Rotas do Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Evita cache do HTML principal
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
